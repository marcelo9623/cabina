<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e12">
  <title>EMEVE PHOTOBOOTH · Studio Pro</title>
  <meta name="description" content="Cabina fotográfica Emeve profesional, local e interactiva.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Barra Superior -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-title">EMEVE <b class="glow">PHOTOBOOTH</b></span>
        <span class="brand-badge">STUDIO PRO v3.6</span>
      </div>
      <button class="icon-btn" id="adminBtn" aria-label="Configuración">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <!-- Ventana 1: Inicio / Bienvenida -->
    <section id="home" class="screen active home">
      <video id="homeVideo" class="homeLive" autoplay muted playsinline aria-label="Cámara en vivo"></video>
      <div class="homeShade"></div>
      <div class="homeCard">
        <div class="glow-pill">Cabina Fotográfica</div>
        <h1>EMEVE</h1>
        <h2>PHOTOBOOTH</h2>
        <p id="homeEvent">Toca para comenzar</p>
        <button class="btn btn-primary btn-hero" id="begin">
          <span>TOCAR PARA COMENZAR</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

    <!-- Ventana 2: Captura de Fotos -->
    <section id="capture" class="screen">
      <div class="captureContainer">
        <aside class="shotRail" id="shotRail" aria-label="Fotos capturadas">
          <div class="shotThumb" id="thumb1"><span>1</span></div>
          <div class="shotThumb" id="thumb2"><span>2</span></div>
          <div class="shotThumb" id="thumb3"><span>3</span></div>
        </aside>
        
        <div class="cameraMain">
          <div class="videoBox">
            <video id="video" autoplay muted playsinline></video>
            <div id="count" class="countdown-overlay"></div>
          </div>
          
          <div class="status-bar">
            <div class="dots" id="dots"></div>
            <p id="captureStatus">Preparando sesión…</p>
          </div>
          
          <div class="actions">
            <button class="btn btn-secondary" id="cancel">Cancelar Sesión</button>
          </div>
        </div>
      </div>
    </section>

    <div id="flash" aria-hidden="true"></div>

    <!-- Ventana 3: Resultado / Impresión -->
    <section id="result" class="screen result">
      <div class="resultCard">
        <div class="resultHeader">
          <h2>¡Sesión Finalizada!</h2>
          <p>Tu composición está lista para guardar o imprimir</p>
        </div>
        
        <div class="canvasWrapper">
          <canvas id="out" class="resultCanvas"></canvas>
        </div>

        <div class="actions resultActions">
          <button class="btn btn-primary" id="save">💾 GUARDAR JPG</button>
          <button class="btn btn-accent" id="print">🖨️ IMPRIMIR</button>
          <button class="btn btn-secondary" id="again">🔄 NUEVA SESIÓN</button>
        </div>
      </div>
    </section>

    <!-- Ventana 4: Panel Modal de Ajustes -->
    <section id="settings" class="screen modal-screen">
      <div class="modalCard">
        <div class="modalHeader">
          <h2>Configuración del Sistema</h2>
          <button class="icon-btn close-btn" id="closeSettings">&times;</button>
        </div>
        
        <div class="settingsTabs">
          <button class="tab-btn active" data-tab="tab-capture">Captura</button>
          <button class="tab-btn" data-tab="tab-design">Diseño y Texto</button>
          <button class="tab-btn" data-tab="tab-frames">Plantillas y Marcos</button>
        </div>

        <div class="modalBody">
          <!-- Pestaña Captura -->
          <div class="tab-content active" id="tab-capture">
            <div class="field-group">
              <div class="field">
                <label>Formato de Impresión</label>
                <select id="format">
                  <option value="2x6x2">4×6 pulgadas · 2 tiras de 2×6</option>
                  <option value="4x6">4×6 pulgadas · composición libre</option>
                  <option value="2x6">2×6 pulgadas · una tira</option>
                </select>
              </div>

              <div class="field" id="stripModeField">
                <label>Distribución de tiras en 4×6</label>
                <select id="stripMode">
                  <option value="duplicate">Tira derecha = copia de la izquierda</option>
                  <option value="independent">Dos tiras independientes</option>
                </select>
              </div>

              <div class="field">
                <label>Tiempo de cuenta regresiva</label>
                <select id="delay">
                  <option value="3">3 Segundos</option>
                  <option value="5">5 Segundos</option>
                  <option value="10">10 Segundos</option>
                </select>
              </div>

              <div class="field">
                <label>Nombre del Evento</label>
                <input id="event" placeholder="Ej. Matrimonio Juan & María">
              </div>
            </div>
          </div>

          <!-- Pestaña Diseño -->
          <div class="tab-content" id="tab-design">
            <div class="field-group">
              <div class="field">
                <label>Texto Superior</label>
                <input id="topText" value="EMEVE PHOTOBOOTH">
              </div>
              <div class="field">
                <label>Texto Inferior</label>
                <input id="bottomText" value="No hacemos eventos, creamos experiencias">
              </div>
              <div class="color-row">
                <div class="field">
                  <label>Fondo</label>
                  <input id="bg" type="color" value="#ffffff">
                </div>
                <div class="field">
                  <label>Texto</label>
                  <input id="fg" type="color" value="#111111">
                </div>
              </div>
              <div class="field">
                <label>Overlay / Marco Transparente (PNG)</label>
                <input id="frame" type="file" accept="image/*">
                <button class="btn btn-small btn-secondary mt-2" id="clearFrame">Quitar Marco</button>
              </div>
            </div>
          </div>

          <!-- Pestaña Marcos & Vista Previa -->
          <div class="tab-content" id="tab-frames">
            <div class="framesGrid">
              <div class="framesControls">
                <h3>Disposición de Marcos</h3>
                <div id="frameList" class="frameList"></div>
                <button class="btn btn-secondary btn-small mt-2" id="addFrame">+ Agregar Marco</button>
              </div>

              <div class="previewBox">
                <h3>Vista Previa</h3>
                <div class="previewCanvasContainer">
                  <canvas id="designPreview"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="modalFooter">
          <button class="btn btn-secondary" id="exportConfig">Exportar JSON</button>
          <button class="btn btn-secondary" id="importConfig">Importar JSON</button>
          <input id="configFile" type="file" accept="application/json,.json" class="hidden">
          <button class="btn btn-primary" id="saveTemplate">Guardar Ajustes</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
