<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabina Fotográfica Offline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Cabina Fotográfica</h1>
    <nav>
      <button onclick="showSection('kiosk')">Modo Kiosco</button>
      <button onclick="showSection('templates')">Editor de Plantilla</button>
      <button onclick="showSection('gallery')">Galería</button>
    </nav>
  </header>

  <main>
    <!-- MODO KIOSCO DE CAPTURA (SECCIÓN PRINCIPAL) -->
    <section id="sec-kiosk" class="active">
      <div class="kiosk-container">
        <div id="countdown-overlay"></div>
        <video id="webcam" autoplay playsinline></video>
        <div class="kiosk-controls">
          <button id="start-session-btn" onclick="startPhotoSession()">Iniciar Sesión (3 Fotos)</button>
        </div>
      </div>
    </section>

    <!-- EDITOR DE PLANTILLAS -->
    <section id="sec-templates">
      <h2>Editor de Plantilla (Doble tira 2x6" en hoja 4x6")</h2>
      <div class="card">
        <label>Texto / Banner inferior:</label>
        <input type="text" id="tmpl-title-input" placeholder="Texto (ej. Mis 15 Años)" oninput="updateTemplateConfig()">
        
        <label>Color de Fondo:</label>
        <input type="color" id="tmpl-bg-color" value="#ffffff" onchange="updateTemplateConfig()">
        
        <label>Color del Texto:</label>
        <input type="color" id="tmpl-text-color" value="#000000" onchange="updateTemplateConfig()">

        <label>Marco / Overlay PNG Transparente (Opcional):</label>
        <input type="file" id="tmpl-overlay-input" accept="image/png" onchange="loadOverlay(event)">
        <button type="button" onclick="clearOverlay()" class="btn-danger">Quitar Marco PNG</button>
      </div>

      <h3>Vista Previa del Lienzo 4x6" (1200x1800 px)</h3>
      <div class="canvas-container">
        <canvas id="template-canvas" width="1200" height="1800"></canvas>
      </div>
    </section>

    <!-- GALERÍA Y REVISIÓN / IMPRESIÓN -->
    <section id="sec-gallery">
      <h2>Galería de Fotos Capturadas</h2>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
