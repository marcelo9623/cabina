<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabina Fotográfica Offline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Cabina Fotográfica</h1>
    <nav>
      <button onclick="showSection('kiosk')">Modo Kiosco</button>
      <button onclick="showSection('templates')">Editor de Plantilla</button>
      <button onclick="showSection('gallery')">Galería</button>
    </nav>
  </header>

  <main>
    <!-- MODO KIOSCO DE CAPTURA -->
    <section id="sec-kiosk" class="active">
      <div class="kiosk-container">
        <video id="webcam" autoplay playsinline></video>
        <div id="countdown-overlay"></div>
        
        <!-- PANTALLA POST-SESIÓN (IMPRIMIR Y COMPARTIR) -->
        <div id="result-modal" class="result-modal" style="display: none;">
          <div class="result-content">
            <h2>¡Tu Tira de Fotos está Lista!</h2>
            <img id="result-preview-img" src="" alt="Resultado 4x6">
            <div class="result-actions">
              <button onclick="printCurrentPhoto()" class="btn-print">🖨️ Imprimir</button>
              <button onclick="shareCurrentPhoto()" class="btn-share">📲 Compartir / Descargar</button>
              <button onclick="closeResultModal()" class="btn-secondary">🔄 Nueva Sesión</button>
            </div>
          </div>
        </div>

        <div class="kiosk-controls">
          <button id="start-session-btn" onclick="startPhotoSession()">Iniciar Sesión (3 Fotos)</button>
        </div>
      </div>
    </section>

    <!-- EDITOR DE PLANTILLAS -->
    <section id="sec-templates">
      <h2>Editor de Plantilla Personalizable (Tira 2x6" en Hoja 4x6")</h2>
      
      <div class="editor-grid">
        <div class="card">
          <h3>Ajustes Generales</h3>
          <label>Texto / Banner inferior:</label>
          <input type="text" id="tmpl-title-input" placeholder="Texto (ej. Mis 15 Años)" oninput="updateTemplateConfig()">
          
          <label>Color de Fondo:</label>
          <input type="color" id="tmpl-bg-color" value="#ffffff" onchange="updateTemplateConfig()">
          
          <label>Color del Texto:</label>
          <input type="color" id="tmpl-text-color" value="#000000" onchange="updateTemplateConfig()">

          <label>Forma de las Fotos:</label>
          <select id="tmpl-shape-select" onchange="updateTemplateConfig()">
            <option value="rect">Rectangular (9:16)</option>
            <option value="rounded">Bordes Redondeados</option>
          </select>

          <label>Radio de Bordes Redondeados: 
            <input type="range" id="tmpl-border-radius" min="0" max="80" value="20" oninput="updateTemplateConfig()">
          </label>

          <label>Marco PNG Transparente (Opcional):</label>
          <input type="file" id="tmpl-overlay-input" accept="image/png" onchange="loadOverlay(event)">
          <button type="button" onclick="clearOverlay()" class="btn-danger">Quitar Marco PNG</button>
        </div>

        <div class="card">
          <h3>Posicionamiento y Tamaño de Fotos</h3>
          
          <!-- CONTROLES AVANZADOS FOTO 1 -->
          <div class="pos-group highlighted-group">
            <h4>⭐ Foto 1 (Ajuste Personalizado)</h4>
            <label>Posición X: <input type="range" id="f1-x" min="-100" max="400" value="40" oninput="updatePhotoPos()"></label>
            <label>Posición Y: <input type="range" id="f1-y" min="-100" max="1400" value="60" oninput="updatePhotoPos()"></label>
            <label>Ancho (px): <input type="range" id="f1-w" min="100" max="600" value="520" oninput="updatePhotoPos()"></label>
            <label>Alto (px): <input type="range" id="f1-h" min="100" max="900" value="924" oninput="updatePhotoPos()"></label>
          </div>

          <!-- CONTROLES FOTO 2 -->
          <div class="pos-group">
            <h4>Foto 2</h4>
            <label>Posición X: <input type="range" id="f2-x" min="-100" max="400" value="40" oninput="updatePhotoPos()"></label>
            <label>Posición Y: <input type="range" id="f2-y" min="-100" max="1400" value="560" oninput="updatePhotoPos()"></label>
            <label>Ancho (px): <input type="range" id="f2-w" min="100" max="600" value="520" oninput="updatePhotoPos()"></label>
          </div>

          <!-- CONTROLES FOTO 3 -->
          <div class="pos-group">
            <h4>Foto 3</h4>
            <label>Posición X: <input type="range" id="f3-x" min="-100" max="400" value="40" oninput="updatePhotoPos()"></label>
            <label>Posición Y: <input type="range" id="f3-y" min="-100" max="1400" value="1060" oninput="updatePhotoPos()"></label>
            <label>Ancho (px): <input type="range" id="f3-w" min="100" max="600" value="520" oninput="updatePhotoPos()"></label>
          </div>
        </div>
      </div>

      <h3>Vista Previa del Lienzo en Tiempo Real (1200x1800 px)</h3>
      <div class="canvas-container">
        <canvas id="template-canvas" width="1200" height="1800"></canvas>
      </div>
    </section>

    <!-- GALERÍA -->
    <section id="sec-gallery">
      <h2>Galería de Fotos Capturadas</h2>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
