<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>EMEVE PHOTOBOOTH · Studio Pro v3.6</title>
  <meta name="description" content="Cabina fotográfica Emeve gratuita, local y adaptable a PC, iPad y iPhone.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Barra Superior -->
    <header class="top">
      <div class="brand">
        EMEVE <b>PHOTOBOOTH</b>
        <small>FULL · GRATIS · ADAPTABLE · v3.6</small>
      </div>
      <button class="gear" id="adminBtn" aria-label="Configuración">⚙️</button>
    </header>

    <!-- PANTALLA 1: INICIO -->
    <section id="home" class="screen active home">
      <video id="homeVideo" class="homeLive" autoplay muted playsinline aria-label="Vista en vivo de la cámara"></video>
      <div class="homeShade" aria-hidden="true"></div>
      <div class="homeBox">
        <h1>EMEVE</h1>
        <h2>PHOTOBOOTH</h2>
        <p id="homeEvent">Toca para comenzar</p>
        <button class="primary" id="begin">TOCAR PARA COMENZAR</button>
      </div>
    </section>

    <!-- PANTALLA 2: CAPTURA -->
    <section id="capture" class="screen">
      <div class="camera">
        <div class="captureLayout">
          <aside class="shotRail" id="shotRail" aria-label="Fotos capturadas">
            <div class="shotThumb" id="thumb1">Foto 1</div>
            <div class="shotThumb" id="thumb2">Foto 2</div>
            <div class="shotThumb" id="thumb3">Foto 3</div>
          </aside>
          <div class="cameraMain">
            <div class="videoBox">
              <video id="video" autoplay muted playsinline></video>
              <div id="count"></div>
            </div>
            <div class="dots" id="dots"></div>
            <p id="captureStatus" style="text-align:center;color:#aaa">Preparando sesión…</p>
            <div class="actions">
              <button class="secondary" id="cancel">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="flash" aria-hidden="true"></div>

    <!-- PANTALLA 3: RESULTADO -->
    <section id="result" class="screen result">
      <div class="resultBox">
        <h2>RESULTADO</h2>
        <canvas id="out" class="resultCanvas" aria-label="Vista previa de la composición final"></canvas>
        <div class="actions" style="margin-top:15px">
          <button class="primary" id="save">GUARDAR JPG</button>
          <button class="primary" id="print">IMPRIMIR</button>
          <button class="secondary" id="again">NUEVA SESIÓN</button>
        </div>
      </div>
    </section>

    <!-- PANTALLA 4: AJUSTES / CONFIGURACIÓN -->
    <section id="settings" class="screen settings">
      <div class="settingsGrid">
        <div class="card">
          <h3>Captura</h3>
          <div class="field">
            <label>Formato de impresión</label>
            <select id="format">
              <option value="2x6x2">4×6 pulgadas · 2 tiras de 2×6</option>
              <option value="4x6">4×6 pulgadas · composición libre</option>
              <option value="2x6">2×6 pulgadas · una tira</option>
            </select>
          </div>
          <div class="field" id="stripModeField">
            <label>Distribución de las tiras en 4×6</label>
            <select id="stripMode">
              <option value="duplicate">Tira derecha = copia de la izquierda</option>
              <option value="independent">Dos tiras independientes</option>
            </select>
          </div>
          <div class="field">
            <label>Cuenta regresiva entre fotos</label>
            <select id="delay">
              <option value="3">3 segundos</option>
              <option value="5">5 segundos</option>
              <option value="10">10 segundos</option>
            </select>
          </div>
          <div class="field">
            <label>Nombre del evento</label>
            <input id="event" placeholder="Ej. Matrimonio Juan y María">
          </div>
        </div>

        <div class="card">
          <h3>Diseño</h3>
          <div class="field">
            <label>Texto superior</label>
            <input id="topText" value="EMEVE PHOTOBOOTH">
          </div>
          <div class="field">
            <label>Texto inferior</label>
            <input id="bottomText" value="No hacemos eventos, creamos experiencias">
          </div>
          <div class="field">
            <label>Fondo</label>
            <input id="bg" type="color" value="#ffffff">
          </div>
          <div class="field">
            <label>Color texto</label>
            <input id="fg" type="color" value="#111111">
          </div>
          <div class="field">
            <label>Imagen de marco / overlay</label>
            <input id="frame" type="file" accept="image/*">
          </div>
          <button class="secondary" id="clearFrame">Quitar marco</button>
        </div>

        <div class="card">
          <h3>Plantilla: asignación de fotos</h3>
          <div id="frameList" class="frameList"></div>
          <button class="secondary" id="addFrame" style="margin-top:10px">+ AGREGAR MARCO</button>
          <button class="primary" id="saveTemplate" style="margin-top:10px">GUARDAR PLANTILLA</button>
          <button class="secondary" id="exportConfig" style="margin-top:8px">EXPORTAR CONFIGURACIÓN</button>
          <button class="secondary" id="importConfig" style="margin-top:8px">IMPORTAR CONFIGURACIÓN</button>
          <input id="configFile" type="file" accept="application/json,.json" class="hidden">
          <button class="secondary" id="closeSettings" style="margin-top:8px">VOLVER A CABINA</button>
        </div>

        <div class="card">
          <h3>Vista previa en tiempo real</h3>
          <div class="preview">
            <canvas id="designPreview"></canvas>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
