<!doctype html>
<html lang='es'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
  <meta name='theme-color' content='#111'>
  <title>EMEVE PHOTOBOOTH · Full Pro v3.7</title>
  <meta name="description" content="Cabina fotográfica Emeve gratuita, local y adaptable a PC, iPad y iPhone.">
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{margin:0;min-width:320px;background:#101010;color:#fff;font-family:Arial,sans-serif;overscroll-behavior-y:contain}
    button,input,select{font:inherit}
    button{border:0;border-radius:14px;padding:13px 17px;color:#fff;background:#252525;min-height:44px;touch-action:manipulation;cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #28a9ff;outline-offset:2px}
    .app{min-height:100vh;min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
    .top{min-height:64px;padding:10px max(18px,env(safe-area-inset-left)) 10px max(18px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #292929;background:#151515;flex-shrink:0}
    .brand{font-size:clamp(16px,2.5vw,21px);font-weight:800;letter-spacing:.5px}
    .brand b{color:#28a9ff}
    .gear{font-size:22px;min-width:44px}
    .screen{display:none;flex:1;min-width:0}
    .screen.active{display:flex}
    .home{position:relative;isolation:isolate;overflow:hidden;align-items:center;justify-content:center;text-align:center;padding:clamp(16px,4vw,40px);min-height:calc(100dvh - 64px);background:#080808}
    .homeLive{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:-2}
    .homeShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.5) 45%,rgba(0,0,0,.72));z-index:-1}
    .homeBox{max-width:650px;width:min(100%,650px);padding:clamp(20px,4vw,42px);border:1px solid #ffffff38;border-radius:28px;background:rgba(8,8,8,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-shadow:0 2px 18px #000}
    .home h1{font-size:clamp(40px,8vw,78px);margin:0 0 8px}
    .home h2{font-size:clamp(22px,4vw,36px);margin:0 0 22px;letter-spacing:.12em}
    .home p{color:#fff;font-size:clamp(18px,3vw,26px);font-weight:600;margin:0 0 24px}
    .primary{background:#147fe3;font-size:clamp(16px,2.5vw,20px);padding:17px 28px;font-weight:bold}
    .secondary{background:#333;font-weight:bold}
    .danger{background:#9f2323}
    .camera{width:min(1300px,100%);margin:auto;padding:clamp(8px,1.5vw,16px)}
    .captureLayout{display:grid;grid-template-columns:clamp(100px,18vw,220px) minmax(0,1fr);gap:clamp(8px,1.5vw,16px);align-items:start}
    .stripSidebar{background:#181818;border:1px solid #303030;border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;min-width:0}
    .stripSidebar h4{margin:0 0 8px;font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:1px}
    .sidebarCanvasBox{width:100%;aspect-ratio:1/3;display:flex;align-items:center;justify-content:center}
    #sidebarCanvas{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:6px}
    .cameraMain{min-width:0}
    .videoBox{position:relative;background:#000;border-radius:clamp(10px,2vw,20px);overflow:hidden;aspect-ratio:16/9;width:100%;max-height:65dvh}
    .videoBox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    #flash{display:none;position:fixed;inset:0;background:#fff;z-index:9999;pointer-events:none}
    #count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(80px,18vw,180px);font-weight:900;text-shadow:0 4px 25px #000;color:#ffeb3b}
    .dots{display:flex;justify-content:center;gap:9px;margin:13px}
    .dot{width:11px;height:11px;border-radius:50%;background:#444}
    .dot.done{background:#28a9ff}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .resultModal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9000;display:flex;align-items:center;justify-content:center;padding:15px}
    .resultBox{width:min(760px,100%);background:#181818;border:1px solid #333;border-radius:20px;padding:20px;text-align:center;max-height:95vh;overflow-y:auto}
    .resultCanvas{background:#fff;max-width:100%;max-height:55dvh;height:auto;width:auto;object-fit:contain;border-radius:10px;border:1px solid #444}
    .settings{padding:clamp(10px,2.5vw,24px);overflow:auto;overscroll-behavior:contain;min-height:0}
    .settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:clamp(10px,1.5vw,15px);max-width:1400px;margin:auto;align-items:start}
    .card{background:#181818;border:1px solid #303030;border-radius:18px;padding:clamp(12px,1.5vw,17px);min-width:0}
    .card h3{margin-top:0}
    .field{margin:12px 0}
    .field label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}
    input,select{width:100%;min-width:0;background:#252525;color:#fff;border:1px solid #444;border-radius:10px;padding:11px;font-size:16px;min-height:44px}
    input[type=color]{padding:4px;min-height:44px}
    .frameList{display:grid;gap:10px}
    .frameItem{background:#202020;border:1px solid #383838;border-radius:12px;padding:10px;min-width:0}
    .frameItem strong{display:block;margin-bottom:7px}
    .miniGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .smallBtn{padding:8px 10px;border-radius:9px;font-size:13px;min-height:38px}
    .galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;width:100%;padding:15px}
    .galleryItem{background:#181818;border:1px solid #303030;border-radius:12px;padding:10px;text-align:center}
    .galleryItem img{width:100%;height:auto;border-radius:6px}
    .hidden{display:none}
    @media(max-width:760px){
      .captureLayout{grid-template-columns:clamp(75px,20vw,110px) minmax(0,1fr)}
      .designGrid{grid-template-columns:minmax(0,1fr)}
      .settingsGrid{grid-template-columns:minmax(0,1fr)}
    }
  </style>
</head>
<body>
<div class='app'>
  <header class='top'>
    <div class='brand'>EMEVE <b>PHOTOBOOTH</b><small style='display:block;font-size:10px;letter-spacing:1.5px;color:#9ca3af;font-weight:600'>FULL · PRO · v3.7</small></div>
    <div>
      <button onclick="showNav('home')">Inicio</button>
      <button onclick="showNav('gallery')">Galería</button>
      <button class='gear' id='adminBtn' aria-label='Configuración'>⚙️</button>
    </div>
  </header>

  <!-- PANTALLA DE INICIO -->
  <section id='home' class='screen active home'>
    <video id='homeVideo' class='homeLive' autoplay muted playsinline></video>
    <div class='homeShade' aria-hidden='true'></div>
    <div class='homeBox'>
      <h1>EMEVE</h1>
      <h2>PHOTOBOOTH</h2>
      <p id='homeEvent'>Toca para comenzar
