<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111'><title>Emeve PhotoBooth</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:13px 17px;color:#fff;background:#252525}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:64px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;background:#151515}.brand{font-size:21px;font-weight:800;letter-spacing:.5px}.brand b{color:#28a9ff}.gear{font-size:22px}.screen{display:none;flex:1}.screen.active{display:flex}.home{align-items:center;justify-content:center;text-align:center;padding:30px}.homeBox{max-width:650px;width:100%}.home h1{font-size:clamp(40px,8vw,78px);margin:0 0 8px}.home p{color:#aaa}.primary{background:#147fe3;font-size:20px;padding:17px 28px}.camera{width:min(900px,96vw);margin:auto;padding:16px}.videoBox{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:4/3}.videoBox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(80px,18vw,180px);font-weight:900;text-shadow:0 4px 25px #000}.dots{display:flex;justify-content:center;gap:9px;margin:13px}.dot{width:11px;height:11px;border-radius:50%;background:#444}.dot.done{background:#28a9ff}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.result{align-items:center;justify-content:center;padding:20px}.resultBox{width:min(760px,96vw);text-align:center}.resultCanvas{background:#fff;max-width:100%;height:auto;border-radius:10px}.settings{padding:20px;overflow:auto}.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px;max-width:1100px;margin:auto}.card{background:#181818;border:1px solid #303030;border-radius:18px;padding:17px}.card h3{margin-top:0}.field{margin:12px 0}.field label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}input,select{width:100%;background:#252525;color:#fff;border:1px solid #444;border-radius:10px;padding:11px}.danger{background:#9f2323}.secondary{background:#333}.design{padding:20px}.designGrid{max-width:1100px;margin:auto;display:grid;grid-template-columns:320px 1fr;gap:18px}.preview{background:#202020;border-radius:18px;padding:15px;text-align:center}.preview canvas{max-width:100%;height:auto;background:#fff}.hidden{display:none}@media(max-width:760px){.designGrid{grid-template-columns:1fr}.top{height:56px}}
</style></head><body><div class='app'><header class='top'><div class='brand'>EMEVE <b>PHOTOBOOTH</b></div><button class='gear' id='adminBtn'>⚙️</button></header>
<section id='home' class='screen active home'><div class='homeBox'><h1>EMEVE</h1><h2>PHOTOBOOTH</h2><p id='homeEvent'>Toca para comenzar</p><button class='primary' id='begin'>TOCAR PARA COMENZAR</button></div></section>
<section id='capture' class='screen'><div class='camera'><div class='videoBox'><video id='video' autoplay muted playsinline></video><div id='count'></div></div><div class='dots' id='dots'></div><div class='actions'><button class='primary' id='take'>TOMAR FOTO</button><button class='secondary' id='cancel'>Cancelar</button></div></div></section>
<section id='result' class='screen result'><div class='resultBox'><h2>RESULTADO</h2><canvas id='out' class='resultCanvas'></canvas><div class='actions' style='margin-top:15px'><button class='primary' id='save'>GUARDAR JPG</button><button class='primary' id='print'>IMPRIMIR</button><button class='secondary' id='again'>NUEVA SESIÓN</button></div></div></section>
<section id='settings' class='screen settings'><div class='settingsGrid'><div class='card'><h3>Captura</h3><div class='field'><label>Formato</label><select id='format'><option value='2x6x2'>2 tiras 2×6 (3 fotos duplicadas)</option><option value='4x6'>4×6 horizontal</option><option value='2x6'>Una tira 2×6</option></select></div><div class='field'><label>Cuenta regresiva</label><select id='delay'><option value='3'>3 segundos</option><option value='5'>5 segundos</option><option value='10'>10 segundos</option></select></div><div class='field'><label>Fotos por sesión</label><select id='photos'><option value='3'>3</option><option value='5'>5</option><option value='10'>10</option></select></div><div class='field'><label>Nombre del evento</label><input id='event' placeholder='Ej. Matrimonio Juan y María'></div></div><div class='card'><h3>Diseño</h3><div class='field'><label>Texto superior</label><input id='topText' value='EMEVE PHOTOBOOTH'></div><div class='field'><label>Texto inferior</label><input id='bottomText' value='No hacemos eventos, creamos experiencias'></div><div class='field'><label>Fondo</label><input id='bg' type='color' value='#ffffff'></div><div class='field'><label>Color texto</label><input id='fg' type='color' value='#111111'></div><div class='field'><label>Marco PNG/JPG</label><input id='frame' type='file' accept='image/*'></div><button class='secondary' id='clearFrame'>Quitar marco</button></div><div class='card'><h3>Plantilla</h3><button class='primary' id='saveTemplate'>GUARDAR CONFIGURACIÓN</button><button class='secondary' id='closeSettings' style='margin-top:8px'>VOLVER A CABINA</button><p style='color:#888;font-size:13px'>La configuración queda guardada en este dispositivo.</p></div></div></section></div>
<script>
const $=id=>document.getElementById(id);let stream=null,shots=[],frame=null;let cfg=JSON.parse(localStorage.getItem('emeveCfg')||'null')||{format:'2x6x2',delay:3,photos:3,event:'',topText:'EMEVE PHOTOBOOTH',bottomText:'No hacemos eventos, creamos experiencias',bg:'#ffffff',fg:'#111111',frame:null};
function apply(){for(const k of ['format','delay','photos','event','topText','bottomText','bg','fg'])$(k).value=cfg[k];$('homeEvent').textContent=cfg.event||'Toca para comenzar';if(cfg.frame){let im=new Image();im.onload=()=>frame=im;im.src=cfg.frame}}
function saveCfg(){for(const k of ['format','delay','photos','event','topText','bottomText','bg','fg'])cfg[k]=$(k).value;cfg.frame=frame?frame.src:null;localStorage.setItem('emeveCfg',JSON.stringify(cfg));$('homeEvent').textContent=cfg.event||'Toca para comenzar'}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function dots(){ $('dots').innerHTML='';for(let i=0;i<+cfg.photos;i++){let d=document.createElement('i');d.className='dot '+(i<shots.length?'done':'');$('dots').appendChild(d)}}
async function camera(){if(!stream){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream}catch(e){alert('No se pudo abrir la cámara. En iPad/iPhone debes abrir esta app desde HTTPS o como aplicación instalada y permitir Cámara.');return false}}return true}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function take(){if(shots.length>=+cfg.photos)return;$('take').disabled=true;for(let i=+cfg.delay;i>0;i--){$('count').style.display='flex';$('count').textContent=i;await wait(1000)}$('count').style.display='none';let c=document.createElement('canvas');c.width=$('video').videoWidth||1280;c.height=$('video').videoHeight||960;c.getContext('2d').drawImage($('video'),0,0,c.width,c.height);shots.push(c.toDataURL('image/jpeg',.94));dots();$('take').disabled=false;if(shots.length>=+cfg.photos){setTimeout(makeOutput,350)}}
function img(src){return new Promise(res=>{let im=new Image();im.onload=()=>res(im);im.src=src})}
async function makeOutput(){let fmt=cfg.format,W=1200,H=800;if(fmt==='2x6x2'){W=1200;H=800}if(fmt==='2x6'){W=400;H=1200}$('out').width=W;$('out').height=H;let c=$('out'),x=c.getContext('2d');x.fillStyle=cfg.bg;x.fillRect(0,0,W,H);let images=await Promise.all(shots.map(img));if(fmt==='2x6x2'){drawStrip(x,0,0,600,800,images);drawStrip(x,600,0,600,800,images);x.strokeStyle='#aaa';x.setLineDash([8,8]);x.beginPath();x.moveTo(600,0);x.lineTo(600,800);x.stroke();x.setLineDash([])}else if(fmt==='2x6'){drawStrip(x,0,0,400,1200,images)}else{draw4x6(x,W,H,images)}if(frame)x.drawImage(frame,0,0,W,H);show('result')}
function drawStrip(x,ox,oy,w,h,ims){x.save();x.translate(ox,oy);x.fillStyle=cfg.fg;x.textAlign='center';x.font='bold 27px Arial';x.fillText(cfg.event||cfg.topText,w/2,30);let top=50,bottom=55,area=h-top-bottom,n=ims.length,slot=area/n;ims.forEach((im,i)=>x.drawImage(im,8,top+i*slot+4,w-16,slot-8));x.font='15px Arial';x.fillText(cfg.bottomText,w/2,h-17);x.lineWidth=5;x.strokeStyle=cfg.fg;x.strokeRect(3,3,w-6,h-6);x.restore()}
function draw4x6(x,W,H,ims){x.fillStyle=cfg.fg;x.textAlign='center';x.font='bold 32px Arial';x.fillText(cfg.event||cfg.topText,W/2,40);let top=65,bottom=55,slot=(H-top-bottom)/ims.length;ims.forEach((im,i)=>x.drawImage(im,30,top+i*slot+5,W-60,slot-10));x.font='16px Arial';x.fillText(cfg.bottomText,W/2,H-20);x.lineWidth=6;x.strokeStyle=cfg.fg;x.strokeRect(3,3,W-6,H-6)}
$('begin').onclick=async()=>{saveCfg();shots=[];dots();if(await camera())show('capture')};$('take').onclick=take;$('cancel').onclick=()=>{shots=[];show('home')};$('again').onclick=()=>{shots=[];dots();show('home')};$('adminBtn').onclick=()=>show('settings');$('closeSettings').onclick=()=>{saveCfg();show('home')};$('saveTemplate').onclick=()=>{saveCfg();alert('Configuración guardada en este dispositivo.')};
$('frame').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{frame=im;saveCfg()};im.src=r.result};r.readAsDataURL(f)};$('clearFrame').onclick=()=>{frame=null;cfg.frame=null;saveCfg();$('frame').value=''};
$('save').onclick=()=>{let a=document.createElement('a');a.download='emeve-photobooth.jpg';a.href=$('out').toDataURL('image/jpeg',.95);a.click()};$('print').onclick=()=>{let w=window.open('','_blank');if(!w){alert('Permite ventanas emergentes para imprimir.');return}w.document.write('<html><head><style>@page{size:6in 4in;margin:0}body{margin:0}img{width:6in;height:4in}</style></head><body><img src="'+$('out').toDataURL('image/jpeg',.95)+'"><script>onload=()=>print()<\\/script></body></html>');w.document.close()};
apply();dots();
</script></body></html>
